<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="{{ url_for('static', filename='payroll.css') }}">
  <title>NigerianPayroll</title>
</head>
<body>
  <div class="MFORM">
   <form action="/" method="POST">
   <h>University Payroll</h>
   <p>Enter Lecturers Details Below</p>
   <label>Age:</label>
   <input name="age" type="number" placeholder="Enter Lecturer Age" required>
   <br>
   <label>Years Of Experience:</label>
   <input type="number" name="experience" placeholder="Enter Years of experience" step="any" required>
   <br>
   <label>Courses Taught:</label>
   <input type="number" name="courses" placeholder="Enter Number Of Courses" required>
   <br>
   <label>Publications:</label>
   <input type="number" name="publications" placeholder="Enter the number of Publications" required>
   <br>
   <label>Performance Score(/10):</label>
   <input type="number" name="performance" placeholder="Enter Family Income" step="any" required >
   <br>
   <label>Student Supervised:</label>
   <input type="number" name="student" placeholder="Enter Number of Students" required>
   <br>
   <label>State:</label>
   <select name="state">
     <option value="Abuja">Abuja</option>
     <option value="Kaduna">Kaduna</option>
     <option value="Sokoto">Sokoto</option>
     <option value="Delta">Delta</option>
     <option value="Rivers">Rivers</option>
     <option value="Kwara">Kwara</option>
     <option value="Oyo">Oyo</option>
     <option value="Taraba">Taraba</option>
     <option value="Enugu">Enugu</option>
     <option value="Lagos">Lagos</option>
     <option value="Imo">Imo</option>
     <option value="Kano">Kano</option>
     <option value="Bauchi">Bauchi</option>
     <option value="Anambra">Anambra</option>
     <option value="Niger">Niger</option>
     <option value="Benue">Benue</option>
     <option value="Katsina">Katsina</option>
     <option value="Zamfara">Zamfara</option>
     <option value="Adamawa">Adamawa</option>
     <option value="Plateau">Plateau</option>
   </select>
   <br>
   <label>University:</label>
   <select name="university">
     <option value="Nnamdi Azikiwe University">Nnamdi Azikiwe University</option>
     <option value="Ahmadu Bello University">A.B.U Zaria</option>
     <option value="University of Nigeria Nsukka">U.N Nsukka</option>
     <option value="University of Ilorin">University of Ilorin</option>
     <option value="Federal University of Technology Minna">F.U.T Minna</option>
     <option value="Obafemi Awolowo University">Obafemi Awolowo University</option>
     <option value="University of Benin">University of Benin</option>
     <option value="Abubakar Tafawa Balewa University Bauchi">A.T.B.U Bauchi</option>
     <option value="University of Lagos">University of Lagos</option>
     <option value="Bayero University Kano">Bayero University Kano</option>
   </select>
   <br>
       <label>Department:</label> 
    <select name="department">
        <option value="Agriculture">Agriculture</option>
        <option value="Accounting">Accounting</option>
        <option value="Architecture">Architecture</option>
        <option value="Biology">Biology</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Computer science">Computer science</option>
        <option value="Education">Education</option>
        <option value="Engineering">Engineering</option>
        <option value="Economics">Economics</option>
        <option value="English">English</option>
        <option value="Geography">Geography</option>
        <option value="History">History</option>
        <option value="Law">Law</option>
        <option value="Library science">Library science</option>
        <option value="Medicine">Medicine</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Nursing">Nursing</option>
        <option value="Pharmacy">Pharmacy</option>
        <option value="Statistics">Statistics</option>
      </select>
      <br>
      <label>Rank:</label>
      <select name="rank">
        <option value="Professor">Professor</option>
        <option value="Associate professor">Associate Professor</option>
        <option value="Senior lecturer">Senior Lecturer</option>
        <option value="Lecturer i">Lecturer I</option>
        <option value="Lecturer ii">Lecturer II</option>
        <option value="Graduate assistant">Graduate Assistant</option>
      </select>
    <br>  
   <label>Qualification:</label>
   <select name="qualification">
     <option value="Ph.D">Ph.D</option>
     <option value="M.Tech">M.Tech</option>
     <option value="M.Sc">M.Sc</option>
     <option value="M.Ed">M.Ed</option>
     <option value="MBA">MBA</option>
     <option value="LL.B">LL.B</option>
     <option value="M.Phil">M.Phil</option>
     <option value="B.Tech">B.Tech</option>
     <option value="B.Sc">B.Sc</option>
     <option value="B.Ed">B.Ed</option>
   </select>
   <br>
   <label>Employment Type:</label>
   <select name="employmenttype">
     <option value="Full-time staff">Full-time Staff</option>
     <option value="Part-time staff">Part-time Staff</option>
     <option value="Visiting staff">Visiting Staff</option>
     <option value="Contract staff">Contract Staff</option>
     <option value="Adjunct staff">Adjunct Staff</option>
   </select>
   <br>
   <label>Gender:</label>
   <select name="gender">
     <option value="0">Female</option>
     <option value="1">Male</option>
   </select>
   <br>
   <button type="submit">Category</button>
   <br>
   <div class="{{ Category_class }}">
    {% if category %}{{ category }}{% endif %}
  </div>
  </form>
</body>   
  </div>
</html>
